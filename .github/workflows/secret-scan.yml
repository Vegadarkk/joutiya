name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        # Version and checksum move together (gitleaks_<version>_checksums.txt on the release).
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # Without --log-opts, gitleaks scans every branch checkout fetched (git log --all). A pull
          # request answers for its own history only (its merge commit's), so another branch's finding
          # never blocks it; a push to main still scans every branch.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            ./gitleaks git --redact --verbose --exit-code 1 --log-opts="--full-history HEAD" .
          else
            ./gitleaks git --redact --verbose --exit-code 1 .
          fi

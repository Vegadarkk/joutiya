name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit and rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Real engine for the search contract suite and the latency benchmark (D1, D24). The master key only
      # lives in this runner; the app keys are created from it by scripts/search-setup.ts.
      meilisearch:
        image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
        ports: ["7700:7700"]
        env:
          MEILI_ENV: production
          MEILI_NO_ANALYTICS: "true"
          MEILI_MASTER_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}-meilisearch
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:7700/health"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Firestore emulator (rules tests).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # The emulator jar follows firebase-tools in the lockfile.
      - name: Cache the Firestore emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      - name: Third-party targets
        run: |
          node scripts/assert-target.ts
          node --test scripts/assert-target.test.ts scripts/legal-config.test.ts
      - run: npm run lint
      - name: Typecheck (app and uptime Worker)
        run: |
          npm run typecheck
          npx tsc -p workers/uptime-probe --noEmit
      # The real-model block of tests/unit/media-classify.test.ts runs only with the ONNX files (22 MB,
      # never committed): weights only in the cache, so the checkout's MANIFEST and README stay.
      - name: Cache the ONNX models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/*.onnx
          key: onnx-models-${{ hashFiles('models/MANIFEST.json') }}
      # Verifies each sha256, skips valid files (cache hit), fails the job on a bad download.
      - name: ONNX models (docs/models.md)
        run: node scripts/fetch-models.ts
      - run: npm test
      - name: Firestore rules (emulator)
        run: npm run test:rules
      - name: API tests (Auth + Firestore emulators)
        run: npm run test:api
      # Step-scoped keys: the other steps keep the memory engine.
      - name: Search engine contract and benchmark (Meilisearch)
        env:
          MEILI_URL: http://localhost:7700
          MEILI_MASTER_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}-meilisearch
        run: |
          node scripts/search-setup.ts --write-env "$RUNNER_TEMP/meilisearch.env" --apply
          set -a; . "$RUNNER_TEMP/meilisearch.env"; set +a
          echo "::add-mask::$MEILI_SEARCH_KEY"
          echo "::add-mask::$MEILI_INDEX_KEY"
          unset MEILI_MASTER_KEY
          npm run test:search
          node scripts/bench-search.ts --docs 20000 --requests 300 --concurrency 4
      - name: VM scripts
        run: shellcheck infra/vm/*.sh
      - name: Compose projects
        run: |
          for env in staging prod; do
            sudo mkdir -p /etc/joutiya/$env/gcp/web /etc/joutiya/$env/gcp/worker
            for file in app valkey-queue valkey-ratelimit meilisearch tunnel; do sudo touch /etc/joutiya/$env/$file.env; done
            APP_ENV=$env RELEASE=0123456789ab docker compose -f docker/compose.yml -f docker/compose.$env.yml config --quiet
          done

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The standalone build searches a real Meilisearch, as staging and production do. The master key only
      # lives in this runner; the app keys are created from it by scripts/search-setup.ts.
      meilisearch:
        image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
        ports: ["7700:7700"]
        env:
          MEILI_ENV: production
          MEILI_NO_ANALYTICS: "true"
          MEILI_MASTER_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}-meilisearch
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:7700/health"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Auth and Firestore emulators around the e2e run (test:e2e wraps `firebase emulators:exec`).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # The emulator jars and the Chromium build follow firebase-tools and @playwright/test in the lockfile.
      - name: Cache the emulators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The web server inherits these (playwright.config.ts): web and dev rebuild route use both keys.
      - name: Search keys
        env:
          MEILI_URL: http://localhost:7700
          MEILI_MASTER_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}-meilisearch
        run: |
          node scripts/search-setup.ts --write-env "$RUNNER_TEMP/meilisearch.env" --apply
          set -a; . "$RUNNER_TEMP/meilisearch.env"; set +a
          echo "::add-mask::$MEILI_SEARCH_KEY"
          echo "::add-mask::$MEILI_INDEX_KEY"
          {
            echo "MEILI_URL=$MEILI_URL"
            echo "MEILI_SEARCH_KEY=$MEILI_SEARCH_KEY"
            echo "MEILI_INDEX_KEY=$MEILI_INDEX_KEY"
          } >> "$GITHUB_ENV"
      - run: npm run test:e2e
      # Static map baseline (design D10): it must come from this Linux image (fonts), so while none is
      # committed this job renders it and publishes it as the "visual-baseline" artifact (and in the log,
      # base64 between markers). Commit it under tests/e2e/visual/static-map.spec.ts-snapshots/ to arm the test.
      - name: Render the static map baseline when none is committed
        id: baseline
        if: hashFiles('tests/e2e/visual/static-map.spec.ts-snapshots/*.png') == ''
        run: |
          npx firebase emulators:exec --only auth,firestore --project demo-joutiya "npx playwright test tests/e2e/visual --update-snapshots"
          for file in tests/e2e/visual/static-map.spec.ts-snapshots/*.png; do
            echo "BASELINE-BEGIN $(basename "$file")"
            base64 -w0 "$file"
            echo
            echo "BASELINE-END"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.baseline.outcome == 'success'
        with:
          name: visual-baseline
          path: tests/e2e/visual/static-map.spec.ts-snapshots/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Production dependencies, high and critical
        run: npm audit --omit=dev --audit-level=high

  image:
    name: Docker image (arm64)
    # Pull requests that touch the image only: the e2e job's `npm run build` already covers the app
    # and worker bundles, and the staging deploy builds the image on main once enabled.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Changed files
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        # grep reads the whole list: with pipefail, `grep -q` closing early would fail git diff and skip the build.
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -E '^(docker/|\.dockerignore|package(-lock)?\.json|next\.config\.ts|scripts/build-node\.ts|scripts/check-worker-imports\.ts|scripts/fetch-models\.ts|models/|src/worker/|src/server/|src/lib/media/|src/lib/storage/)' >/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build web and worker
        if: steps.changes.outputs.build == 'true'
        run: |
          for target in web worker; do
            docker build -f docker/Dockerfile --target "$target" --build-arg RELEASE="${GITHUB_SHA::12}" -t "joutiya-$target:ci" .
          done
          docker image ls joutiya-web
          docker image ls joutiya-worker
      - name: Boot check of the worker image
        if: steps.changes.outputs.build == 'true'
        # The worker bundle keeps its npm packages external (scripts/build-node.ts): the traced
        # node_modules copied into the image must resolve them, @sentry/node included. sharp and
        # onnxruntime-node load native arm64 binaries, and the models of docs/models.md must be in
        # the image (phase 3): one session on the face model proves both.
        run: |
          docker run --rm joutiya-worker:ci node --check dist/worker/index.mjs
          docker run --rm joutiya-worker:ci node -e "import('@sentry/node').then(() => console.log('ok'))"
          docker run --rm joutiya-worker:ci node -e "import('sharp').then((m) => console.log('sharp: libvips', m.default.versions.vips))"
          docker run --rm joutiya-worker:ci sh -c 'test -s models/nsfw-marqo-384.onnx && test -s models/yunet-2023mar.onnx && ls -l models'
          docker run --rm joutiya-worker:ci node -e "import('onnxruntime-node').then(async (ort) => { const s = await ort.InferenceSession.create('models/yunet-2023mar.onnx', { logSeverityLevel: 3 }); console.log('onnx: inputs', s.inputNames.join()); await s.release(); })"

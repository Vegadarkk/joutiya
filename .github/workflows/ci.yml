name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit and rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Firestore emulator (rules tests).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - name: Third-party targets
        run: |
          node scripts/assert-target.ts
          node --test scripts/assert-target.test.ts
      - run: npm run lint
      - name: Typecheck (app and uptime Worker)
        run: |
          npm run typecheck
          npx tsc -p workers/uptime-probe --noEmit
      - run: npm test
      - name: Firestore rules (emulator)
        run: npm run test:rules
      - name: VM scripts
        run: shellcheck infra/vm/*.sh
      - name: Compose projects
        run: |
          for env in staging prod; do
            sudo mkdir -p /etc/joutiya/$env/gcp/web /etc/joutiya/$env/gcp/worker
            for file in app valkey-queue valkey-ratelimit tunnel; do sudo touch /etc/joutiya/$env/$file.env; done
            APP_ENV=$env RELEASE=0123456789ab docker compose -f docker/compose.yml -f docker/compose.$env.yml config --quiet
          done

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Production dependencies, high and critical
        run: npm audit --omit=dev --audit-level=high

  image:
    name: Docker image (arm64)
    # Pull requests that touch the image only: main builds it in deploy-staging.yml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Changed files
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(docker/|\.dockerignore|package(-lock)?\.json|next\.config\.ts|scripts/build-node\.ts|src/worker/|src/server/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build web and worker
        if: steps.changes.outputs.build == 'true'
        run: |
          for target in web worker; do
            docker build -f docker/Dockerfile --target "$target" --build-arg RELEASE="${GITHUB_SHA::12}" -t "joutiya-$target:ci" .
          done
          docker image ls joutiya-web
          docker image ls joutiya-worker

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit and rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Firestore emulator (rules tests).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # The emulator jar follows firebase-tools in the lockfile.
      - name: Cache the Firestore emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      - name: Third-party targets
        run: |
          node scripts/assert-target.ts
          node --test scripts/assert-target.test.ts
      - run: npm run lint
      - name: Typecheck (app and uptime Worker)
        run: |
          npm run typecheck
          npx tsc -p workers/uptime-probe --noEmit
      - run: npm test
      - name: Firestore rules (emulator)
        run: npm run test:rules
      - name: API tests (Auth + Firestore emulators)
        run: npm run test:api
      - name: VM scripts
        run: shellcheck infra/vm/*.sh
      - name: Compose projects
        run: |
          for env in staging prod; do
            sudo mkdir -p /etc/joutiya/$env/gcp/web /etc/joutiya/$env/gcp/worker
            for file in app valkey-queue valkey-ratelimit tunnel; do sudo touch /etc/joutiya/$env/$file.env; done
            APP_ENV=$env RELEASE=0123456789ab docker compose -f docker/compose.yml -f docker/compose.$env.yml config --quiet
          done

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Auth and Firestore emulators around the e2e run (test:e2e wraps `firebase emulators:exec`).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # The emulator jars and the Chromium build follow firebase-tools and @playwright/test in the lockfile.
      - name: Cache the emulators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Production dependencies, high and critical
        run: npm audit --omit=dev --audit-level=high

  image:
    name: Docker image (arm64)
    # Pull requests that touch the image only: the e2e job's `npm run build` already covers the app
    # and worker bundles, and the staging deploy builds the image on main once enabled.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Changed files
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        # grep reads the whole list: with pipefail, `grep -q` closing early would fail git diff and skip the build.
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -E '^(docker/|\.dockerignore|package(-lock)?\.json|next\.config\.ts|scripts/build-node\.ts|src/worker/|src/server/)' >/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build web and worker
        if: steps.changes.outputs.build == 'true'
        run: |
          for target in web worker; do
            docker build -f docker/Dockerfile --target "$target" --build-arg RELEASE="${GITHUB_SHA::12}" -t "joutiya-$target:ci" .
          done
          docker image ls joutiya-web
          docker image ls joutiya-worker
      - name: Boot check of the worker image
        if: steps.changes.outputs.build == 'true'
        # The worker bundle keeps its npm packages external (scripts/build-node.ts): the traced
        # node_modules copied into the image must resolve them, @sentry/node included.
        run: |
          docker run --rm joutiya-worker:ci node --check dist/worker/index.mjs
          docker run --rm joutiya-worker:ci node -e "import('@sentry/node').then(() => console.log('ok'))"

name: Deploy staging

# Every push on main that passed CI: arm64 image built on GitHub, sent to the VM over SSH through
# Cloudflare Access (no registry), loaded and started by the forced command of deploy-staging
# (infra/vm/deploy-forced-command.sh). Production is promoted by Claude through OCI Run Command
# (scripts/oracle-vm.ts promote): no production key exists, here or anywhere.
#
# The deploy job is inert until the owner sets the repository variable STAGING_DEPLOY_ENABLED=true
# (docs/phase-1.md) and these values:
#   secrets STAGING_DEPLOY_SSH_KEY           private key of deploy-staging (ed25519)
#           STAGING_ACCESS_CLIENT_ID         Access service token "joutiya-ci" (ssh.joutiya.ma)
#           STAGING_ACCESS_CLIENT_SECRET
#   vars    VM_SSH_KNOWN_HOSTS               "ssh.joutiya.ma ssh-ed25519 AAAA..." (host key of the VM)
# The rules job needs only these two (step 9), and runs with or without the VM:
#   vars    FIREBASE_STAGING_WIF_PROVIDER    projects/<number>/locations/global/workloadIdentityPools/github/providers/joutiya
#           FIREBASE_STAGING_DEPLOYER        joutiya-deployer@<staging project>.iam.gserviceaccount.com
#
# Two jobs on purpose: the SSH key only ever exists inside one step of the build job, where no
# third-party action runs, and the OIDC token (id-token: write) is only granted to the rules job.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to staging
    # Once staging is enabled: a push on main whose CI succeeded, or a manual run on main.
    # Before that the job is skipped entirely (CI already proves the image builds).
    if: >-
      vars.STAGING_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      # The "Release images" check run: `oracle-vm.ts promote` refuses images that staging did not
      # load from the tarball recorded there (a leaked staging key can send its own).
      checks: write
    outputs:
      release: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Release
        id: release
        run: echo "id=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build web and worker (linux/arm64)
        env:
          RELEASE: ${{ steps.release.outputs.id }}
        run: |
          for target in web worker; do
            docker build -f docker/Dockerfile --target "$target" --build-arg RELEASE="$RELEASE" -t "joutiya-$target:$RELEASE" .
          done
          {
            echo "### Release $RELEASE"
            echo '| Image | ID |'
            echo '|---|---|'
            for target in web worker; do echo "| joutiya-$target | \`$(docker image inspect --format '{{.Id}}' "joutiya-$target:$RELEASE")\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save and record the tarball
        env:
          RELEASE: ${{ steps.release.outputs.id }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker save -o "$RUNNER_TEMP/release.tar" "joutiya-web:$RELEASE" "joutiya-worker:$RELEASE"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/release.tar" | cut -d ' ' -f 1)"
          echo "| tarball | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/check-runs" -f name="Release images" -f head_sha="$SHA" \
            -f status=completed -f conclusion=success -f "output[title]=Release $RELEASE" -f "output[summary]=tarball $digest" > /dev/null
      - name: Send to the VM
        env:
          RELEASE: ${{ steps.release.outputs.id }}
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
        run: |
          # The key lives only for this step, created unreadable by others, removed on any exit.
          umask 077
          trap 'rm -f ~/.ssh/deploy_staging' EXIT
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_staging
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The CI's SSH proxy is the cloudflared image the VM runs (same tag and digest, kept by Dependabot).
          CLOUDFLARED_IMAGE="$(grep -m 1 -oE 'cloudflare/cloudflared:[^[:space:]]+' docker/compose.yml)"
          test -n "$CLOUDFLARED_IMAGE" || { echo "cloudflared image not found in docker/compose.yml"; exit 1; }
          docker pull --quiet "$CLOUDFLARED_IMAGE"
          zstd -T0 -10 -q -c "$RUNNER_TEMP/release.tar" \
            | ssh -i ~/.ssh/deploy_staging -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
                -o ProxyCommand="docker run --rm -i -e TUNNEL_SERVICE_TOKEN_ID -e TUNNEL_SERVICE_TOKEN_SECRET $CLOUDFLARED_IMAGE access ssh --hostname %h" \
                deploy-staging@ssh.joutiya.ma "load $RELEASE"

  rules:
    name: Firestore rules and indexes (staging)
    # Same events as the deploy job, without its VM: staging may run elsewhere meanwhile (the PC2).
    # The rules deny every client and an index deploy never deletes, so the order against the image
    # does not matter.
    if: >-
      vars.FIREBASE_STAGING_WIF_PROVIDER != '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Workload Identity Federation for the staging Firestore rules (no JSON key).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # firebase-tools from the lockfile (devDependency kept current by Dependabot), not a fresh npx download.
      - run: npm ci --ignore-scripts
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.FIREBASE_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_STAGING_DEPLOYER }}
      - name: Deploy Firestore rules
        run: |
          project="$(node -e "const t=require('./infra/targets.json');process.stdout.write(t.environments.staging.firebase.projectId??'')")"
          test -n "$project" || { echo "environments.staging.firebase.projectId is not recorded"; exit 1; }
          npx firebase deploy --only firestore:rules,firestore:indexes --project "$project" --non-interactive

# Joutiya VM (§6): SSH only through Cloudflare Tunnel + Access (no ingress rule in the VCN),
# key only, no root. Installed as /etc/ssh/sshd_config.d/10-joutiya.conf by bootstrap.sh.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PermitUserEnvironment no
AllowUsers ubuntu deploy-staging deploy-prod

# Deploy users can run one command each, whatever the client asks (their keys also carry the
# "restrict" option). The requested action arrives in SSH_ORIGINAL_COMMAND.
Match User deploy-staging
    PermitTTY no
    ForceCommand sudo -n /usr/local/sbin/joutiya-deploy staging
Match User deploy-prod
    PermitTTY no
    ForceCommand sudo -n /usr/local/sbin/joutiya-deploy prod

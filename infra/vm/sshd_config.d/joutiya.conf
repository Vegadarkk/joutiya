# Joutiya VM (§6): SSH only for the CI's staging deploys, through Cloudflare Tunnel + Access (no
# ingress rule in the VCN), key only, no root. Administration and production go through OCI Run
# Command (scripts/oracle-vm.ts), never SSH. Installed as /etc/ssh/sshd_config.d/10-joutiya.conf
# by infra/vm/install.sh; first value wins, so these settings take precedence over
# /etc/ssh/sshd_config.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PermitUserEnvironment no
AllowUsers deploy-staging

# The deploy user can run one command, whatever the client asks (its key also carries the
# "restrict" option). The requested action arrives in SSH_ORIGINAL_COMMAND.
Match User deploy-staging
    PermitTTY no
    ForceCommand sudo -n /usr/local/sbin/joutiya-deploy staging

# Back to global scope for anything included after this file.
Match all

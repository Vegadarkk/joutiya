# Joutiya VM (§6): ssh.socket listens on loopback only, like ListenAddress in
# infra/vm/sshd_config.d/joutiya.conf; the host cloudflared (tunnel.ssh.json, ssh://localhost:22) is
# the only client. Installed as /etc/systemd/system/ssh.socket.d/10-joutiya.conf by
# infra/vm/install.sh. The empty ListenStream= drops Ubuntu's default [::]:22.
[Socket]
ListenStream=
ListenStream=127.0.0.1:22
ListenStream=[::1]:22

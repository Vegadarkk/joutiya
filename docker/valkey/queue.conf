# valkey-queue: BullMQ jobs and quota counters (§2). Must never lose or evict a key.
bind 0.0.0.0
port 6379
protected-mode yes
maxmemory 192mb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
save 3600 1 300 100
dir /data
# requirepass comes from the command line (secret file), never from this file.

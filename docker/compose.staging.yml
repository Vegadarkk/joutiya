# Staging: separate project, network, volumes, secrets and Tunnel; reduced limits.
# Group joutiya-staging (gid 2002, infra/vm/install.sh): the only group that reads /etc/joutiya/staging/gcp.
services:
  web:
    user: "1000:2002"
    # Two servers like production, so the load test measures the same layout (heap limit per process).
    environment:
      WEB_PROCESSES: "2"
      NODE_OPTIONS: --max-old-space-size=320
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 1024M }
  # sharp (libvips) and the ONNX moderation models allocate outside the V8 heap: half the limit stays native.
  worker:
    user: "1000:2002"
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 1024M }
  valkey-queue:
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }
  valkey-ratelimit:
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 96M }
  meilisearch:
    environment:
      MEILI_MAX_INDEXING_MEMORY: 512MiB
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1024M }
  cloudflared:
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

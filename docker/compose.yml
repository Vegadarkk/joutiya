# Base of the two Compose projects on the VM (§1): joutiya-prod and joutiya-staging, each with
# its own network, volumes, secrets, Tunnel and limits (compose.prod.yml, compose.staging.yml).
# No port is published: cloudflared reaches web:3000 on the internal network.
#
#   APP_ENV=staging RELEASE=<sha> docker compose -f compose.yml -f compose.staging.yml up -d
#
# Secrets live in /etc/joutiya/<env>/*.env (root, 0600), never in this repository.

name: joutiya-${APP_ENV:?APP_ENV is required}

x-service: &service
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-valkey-health: &valkey-health
  test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
  interval: 10s
  timeout: 3s
  retries: 5

services:
  web:
    <<: *service
    image: joutiya-web:${RELEASE:?RELEASE is required}
    # Non-root whatever the image says: uid of the node user in node:24-slim, and a group per
    # environment (compose.<env>.yml) that alone can read /etc/joutiya/<env>/gcp.
    user: "1000:1000"
    env_file:
      - /etc/joutiya/${APP_ENV}/app.env
    environment:
      APP_ENV: ${APP_ENV}
      RELEASE: ${RELEASE}
      GOOGLE_APPLICATION_CREDENTIALS: /etc/joutiya/${APP_ENV}/gcp/web/credentials.json
    volumes:
      # Workload Identity Federation (X.509, §9) of the joutiya-web service account: credential
      # config, certificate config, certificate and key. Same path as on the host, so the paths
      # gcloud wrote into the files stay valid. The worker mounts its own directory only.
      - /etc/joutiya/${APP_ENV}/gcp/web:/etc/joutiya/${APP_ENV}/gcp/web:ro
    # Read-only file system (§2): regenerated ISR pages stay in memory (next.config.ts).
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:uid=1000,mode=0700,size=64m
    networks: [edge, data, egress]
    depends_on:
      valkey-queue: { condition: service_healthy }
      valkey-ratelimit: { condition: service_healthy }
      # Search down = /api/search 503 and /api/health reports it, never a web outage (D2).
      meilisearch: { condition: service_started, required: false }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.status===200?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 20s

  worker:
    <<: *service
    image: joutiya-worker:${RELEASE}
    user: "1000:1000"
    env_file:
      - /etc/joutiya/${APP_ENV}/app.env
    environment:
      APP_ENV: ${APP_ENV}
      RELEASE: ${RELEASE}
      GOOGLE_APPLICATION_CREDENTIALS: /etc/joutiya/${APP_ENV}/gcp/worker/credentials.json
    volumes:
      - /etc/joutiya/${APP_ENV}/gcp/worker:/etc/joutiya/${APP_ENV}/gcp/worker:ro
    read_only: true
    tmpfs: [/tmp]
    networks: [data, egress]
    depends_on:
      valkey-queue: { condition: service_healthy }
      meilisearch: { condition: service_started, required: false }
    # Heartbeat file touched by the worker after each successful write to valkey-queue (30 s).
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(Date.now()-require('fs').statSync('/tmp/joutiya-worker-heartbeat').mtimeMs<90000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  valkey-queue:
    <<: *service
    image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    user: valkey
    env_file:
      - /etc/joutiya/${APP_ENV}/valkey-queue.env
    command: ["sh", "-c", "exec valkey-server /etc/valkey/valkey.conf --requirepass \"$$VALKEY_PASSWORD\""]
    read_only: true
    volumes:
      - ./valkey/queue.conf:/etc/valkey/valkey.conf:ro
      - valkey-queue-data:/data
    networks: [data]
    healthcheck: *valkey-health

  valkey-ratelimit:
    <<: *service
    image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    user: valkey
    env_file:
      - /etc/joutiya/${APP_ENV}/valkey-ratelimit.env
    command: ["sh", "-c", "exec valkey-server /etc/valkey/valkey.conf --requirepass \"$$VALKEY_PASSWORD\""]
    read_only: true
    tmpfs: [/data]
    volumes:
      - ./valkey/ratelimit.conf:/etc/valkey/valkey.conf:ro
    networks: [data]
    healthcheck: *valkey-health

  meilisearch:
    <<: *service
    # The image starts through its own tini.
    init: false
    image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
    # MEILI_MASTER_KEY only (16 bytes at least: production mode refuses to start without it). The app
    # holds two scoped keys created from it by scripts/search-setup.ts (app.env), never the master key.
    env_file:
      - /etc/joutiya/${APP_ENV}/meilisearch.env
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_THREADS: "1"
    read_only: true
    # Request payloads are spooled to /tmp before they reach the task queue on the volume.
    tmpfs:
      - /tmp:size=256m
    volumes:
      - meilisearch-data:/meili_data
    networks: [data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  cloudflared:
    <<: *service
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    # Remote-managed tunnel: ingress rules live in Cloudflare (infra/cloudflare/tunnel.<env>.json).
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - /etc/joutiya/${APP_ENV}/tunnel.env
    environment:
      TUNNEL_METRICS: 127.0.0.1:20241
    read_only: true
    networks: [edge, egress]
    depends_on:
      web: { condition: service_started }
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # cloudflared <-> web only.
  edge: { internal: true }
  # Valkey, Meilisearch: no route outside the project.
  data: { internal: true }
  # Outbound internet (Firestore, Telegram, Cloudflare edge).
  egress: {}

volumes:
  valkey-queue-data: {}
  # Rebuildable from Firestore (scripts/reindex-search.ts): not unique data.
  meilisearch-data: {}

# Production limits on the Oracle A1 VM (2 OCPU, 12 GB, arm64), staging running beside it.
# Group joutiya-prod (gid 2001, infra/vm/install.sh): the only group that reads /etc/joutiya/prod/gcp.
services:
  web:
    user: "1000:2001"
    environment:
      NODE_OPTIONS: --max-old-space-size=1152
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536M }
  # sharp (libvips) and the ONNX moderation models allocate outside the V8 heap: half the limit stays native.
  worker:
    user: "1000:2001"
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 1024M }
  valkey-queue:
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 320M }
  valkey-ratelimit:
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
  meilisearch-init:
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 32M }
  meilisearch:
    environment:
      # Indexing memory stays under the limit; the rest is the memory-mapped index (page cache).
      MEILI_MAX_INDEXING_MEMORY: 1GiB
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 2048M }
  cloudflared:
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }
